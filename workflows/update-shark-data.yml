name: Daily GSAF Data Update

on:
  schedule:
    # Every day at 06:15 UTC
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download & process latest data
        run: python scripts/update_data.py
        # Script exits 0 when it can use cached GSAF + refresh other sources.
        # Only fails if zero records remain.

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shark_data.json data/meta.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily shark data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
